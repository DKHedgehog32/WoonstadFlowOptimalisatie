<!-- 
    =============================================
    Woonstad Flow Choice Buttons Template
    =============================================
    Date: 2025-08-05
    Last Changed: 2025-08-05
    Description:
    Flow LWC with two clickable choice cards:
      - "Naamplaatje aanvragen"
      - "Informatie vraag"
    Each card updates Flow variables and navigates 
    to the next Flow screen immediately.
-->

<template>
    <div class="button-container">
        <!-- Naamplaatje aanvragen -->
        <div class="choice-card" onclick={handleAanvraagClick}>
            <div class={cardLayout}>
                <img src={iconAanvraag} alt="Naamplaatje Icon" class="card-icon" />
                <span class="card-label">Naamplaatje aanvragen</span>
            </div>
        </div>

        <!-- Informatie vraag -->
        <div class="choice-card" onclick={handleVraagClick}>
            <div class={cardLayout}>
                <img src={iconVraag} alt="Info Icon" class="card-icon" />
                <span class="card-label">Informatie vraag</span>
            </div>
        </div>
    </div>
</template>
