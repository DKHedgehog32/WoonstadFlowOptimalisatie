<!-- 
    =============================================
    Woonstad Flow Choice Buttons Template
    =============================================
    Date: 2025-07-31
    Last Changed: 2025-07-31
    Description:
    Lightning Web Component template for Flow Screen
    choice buttons. Provides two options:
      - "Ik heb een aanvraag"
      - "Ik heb een vraag"

    to the next Flow screen.
-->

                <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">

                    <path d="M3.18486 2.01682L2 3.41215L4.43459 5.37469L5.61946 3.97936L3.18486 2.01682Z" fill="#00215B"/>
                </svg>
            </div>
            <span class="button-text">Ik heb een aanvraag</span>
        </div>

        <!-- Button: Ik heb een vraag -->
        <div class="choice-button vraag" onclick={handleVraagClick}>
