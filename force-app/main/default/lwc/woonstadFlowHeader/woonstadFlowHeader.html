<!-- 
    =============================================
    Woonstad Flow Header Template
    =============================================
    Date: 2025-07-31
    Last Changed: 2025-07-31
    Description:
    Lightning Web Component template for displaying 
    a branded Woonstad header in Flow screens.
    - Shows the Woonstad Rotterdam logo on the left.
    - Displays the configurable title centered.
-->

<template>
    <div class="woonstad-header-bar">
        <!-- Woonstad Rotterdam Logo -->
        <img src={logoUrl} alt="Woonstad Rotterdam Logo" class="woonstad-header-logo" />

        <!-- Flow header title, set via @api property -->
        <h1 class="woonstad-header-title">{title}</h1>
    </div>
</template>
