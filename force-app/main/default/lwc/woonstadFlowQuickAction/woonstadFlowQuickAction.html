<!-- 
    =============================================
    WoonstadFlowQuickAction.html
    =============================================
    Date: 2025-08-01
    Last Changed: 2025-08-01
    Description:
    Legacy-style Quick Action for launching a Flow.
    Uses a Woonstad-styled header and lightning-card
    (no quick-action-panel) for clean sizing.
-->

<template>
    <!-- 🔵 Woonstad Blue Header -->
    <div class="woonstad-header-bar">
        <img src={logoUrl} alt="Woonstad Rotterdam Logo" class="woonstad-header-logo" />
        <h1 class="woonstad-header-title">Nieuwe Zaak</h1>
    </div>

    <lightning-card>
        <!-- Flow container -->
        <template if:true={recordId}>
            <div class="flow-container">
                <lightning-flow
                    flow-api-name="Screen_Flow_Create_Update_New_Case_V2"
                    flow-input-variables={flowInputs}
                    onstatuschange={handleStatusChange}>
                </lightning-flow>
            </div>
        </template>

        <!-- Loading placeholder -->
        <template if:false={recordId}>
            <div class="slds-p-around_medium slds-text-align_center">
                <lightning-spinner alternative-text="Laden..." size="medium"></lightning-spinner>
                <p class="slds-m-top_small">Record context wordt geladen...</p>
            </div>
        </template>
    </lightning-card>
</template>
