<template>
    <div class="slds-m-around_medium">

        <!-- Show Account Shipping Data when flag is true -->
        <template if:true={showAccountData}>
            <div class="slds-m-bottom_small field-row">
                <span class="field-label">Actieve shipping address van de aanvrager :</span>
            </div>
            <div class="slds-m-bottom_small field-row">
                <lightning-formatted-text value={shippingStreet}></lightning-formatted-text>
            </div>
            <div class="slds-m-bottom_small field-row">
                <lightning-formatted-text value={shippingPostalCode}></lightning-formatted-text>
            </div>
            <div class="slds-m-bottom_small field-row">
                <lightning-formatted-text value={shippingCity}></lightning-formatted-text>
            </div>
            <div class="slds-m-top_small">
                <b>Controleer of de aanvraag correspondeert met dit adres</b>
            </div>

            <!-- Inline error message if validation fails -->
            <template if:true={errorMessage}>
                <p class="slds-text-color_error slds-m-top_small">{errorMessage}</p>
            </template>
        </template>

        <!-- Show Supplier Data when flag is false -->
        <template if:false={showAccountData}>
            <template if:true={noSupplierFound}>
                <p class="slds-text-color_error slds-text-heading_small">
                    Geen leverancier gevonden voor dit account.
                </p>
            </template>

            <template if:false={noSupplierFound}>
                <div class="slds-m-bottom_small field-row">
                    <span class="field-label">Klant Naam:</span>
                    <lightning-formatted-text value={klantNaam}></lightning-formatted-text>
                </div>
                <div class="slds-m-bottom_small field-row">
                    <span class="field-label">Eigenaar:</span>
                    <lightning-formatted-text value={eigenaar}></lightning-formatted-text>
                </div>
                <div class="slds-m-bottom_small field-row">
                    <span class="field-label">Supplier:</span>
                    <lightning-formatted-text value={supplierName}></lightning-formatted-text>
                </div>
            </template>
        </template>
    </div>
</template>
