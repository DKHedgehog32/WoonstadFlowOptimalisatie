<!-- 
    =============================================
    WoonstadKlantWizardStart.html
    =============================================
    Date: 2025-07-31
    Last Changed: 2025-07-31
    Description:
    Start screen of the Woonstad Customer Creation Wizard.
    - Provides a step indicator (wizard progress).
    - Search bar for existing customers/companies.
    - Options for creating a new company or customer.
    - Navigation actions: cancel and next.
-->

<template>
    <div class="kiosk-form-container">
        <!-- Title -->
        <h1>Nieuwe klant aanmaken</h1>

        <!-- Step Indicator -->
        <div class="step-indicator">
            <span class="step active">1 Zoek de klant</span>
            <span class="step">2 Algemene gegevens</span>
            <span class="step">3 Adresgegevens</span>
            <span class="step">4 Valideren</span>
        </div>

        <!-- Search Input + Icon Button -->
        <div class="search-bar">
            <lightning-input 
                type="search"
                placeholder="Zoek hier of de klant of bedrijf al bestaat"
                value={searchTerm}
                onchange={handleSearchChange}>
            </lightning-input>

            <lightning-button-icon 
                icon-name="utility:search" 
                onclick={handleSearch} 
                alternative-text="Zoek klant of bedrijf">
            </lightning-button-icon>
        </div>

        <!-- Choice Buttons -->
        <div class="choice-buttons">
            <div class="option-card" onclick={handleCreateCompany}>
                Bedrijf aanmaken
            </div>
            <div class="option-card" onclick={handleCreateCustomer}>
                Klant aanmaken
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="navigation">
            <!-- Cancel Button -->
            <lightning-button 
                variant="base" 
                label="Annuleren" 
                onclick={handleCancel}>
            </lightning-button>

            <!-- Next Button with Custom Styling -->
            <div class="custom-next-button" onclick={handleNext}>
                <span class="label">Volgende</span>
                <span class="icon-circle">
                    <lightning-icon
                        icon-name="utility:chevronright"
                        size="x-small"
                        alternative-text="Volgende"
                        class="arrow-icon">
                    </lightning-icon>
                </span>
            </div>
        </div>
    </div>
</template>
