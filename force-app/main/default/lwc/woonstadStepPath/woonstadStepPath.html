<!-- 
    =============================================
    WoonstadStepPath.html
    =============================================
    Date: 2025-08-05
    Last Changed: 2025-08-05
    Description:
    Template for the Woonstad Step Path component.
    - Renders a horizontal stepper from JSON input.
    - Left-aligned, inline circles and labels.
    - Highlights current and completed steps.
    - Displays tooltip text only for the active step.
    =============================================
-->

<template>
    <div class="step-path-container">
        <!-- Row of steps -->
        <div class="step-path">
            <template for:each={steps} for:item="step">
                <div key={step.number}
                     class="step-item"
                     data-id={step.number}
                     onmouseover={handleMouseOver}
                     onmouseout={handleMouseOut}>

                    <div class={step.circleClass}>{step.displayValue}</div>
                    <span class={step.labelClass}>{step.label}</span>

                   <template if:true={step.showTooltip}>
    <div class="custom-tooltip" style={step.tooltipStyle}>
        {step.tooltip}
    </div>
</template>
                </div>
            </template>
        </div>

        <!-- Line as its own row -->
        <div class="step-line"></div>
    </div>
</template>
